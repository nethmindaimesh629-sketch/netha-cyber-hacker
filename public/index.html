<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETHA CYBER HACKER</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  background: #050b08;
  color: #00ff88;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 480px;
  margin: 30px auto;
  padding: 22px;
  background: #0b1510;
  border: 1px solid #00ff8855;
  border-radius: 16px;
  box-shadow: 0 0 25px #00ff8815;
}

h1 {
  text-align: center;
  font-size: 25px;
  overflow-wrap: anywhere;
}

.subtitle {
  text-align: center;
  color: #8bbba1;
  font-size: 13px;
  margin-bottom: 25px;
}

h2 {
  font-size: 18px;
  margin-top: 25px;
}

label {
  display: block;
  margin: 15px 0 8px;
  font-size: 13px;
}

input {
  display: block;
  width: 100%;
  padding: 13px;
  background: #050b08;
  color: white;
  border: 1px solid #24583b;
  border-radius: 8px;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #00ff88;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #00ff88;
  color: #041008;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.secondary {
  background: #173a27;
  color: #00ff88;
  border: 1px solid #24583b;
}

.status {
  margin-top: 12px;
  font-size: 13px;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.panel {
  margin-top: 25px;
  padding-top: 10px;
  border-top: 1px solid #24583b;
}

.hidden {
  display: none !important;
}

.keybox {
  margin-top: 12px;
  padding: 14px;
  background: #061b10;
  border: 1px solid #00ff88;
  border-radius: 8px;
  overflow-wrap: anywhere;
  color: white;
  line-height: 1.6;
}

.item {
  margin-top: 10px;
  padding: 12px;
  background: #07100b;
  border: 1px solid #20452f;
  border-radius: 8px;
  color: #c3e8d0;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.item button {
  background: #562222;
  color: white;
}

#protectedContent {
  padding: 16px;
  border: 1px solid #00ff88;
  border-radius: 10px;
  margin-top: 18px;
  background: #061b10;
  color: white;
  line-height: 1.7;
}

footer {
  text-align: center;
  margin-top: 25px;
  color: #648673;
  font-size: 11px;
}
</style>
</head>

<body>

<main class="container">

  <h1>NETHA CYBER HACKER</h1>

  <div class="subtitle">
    ACCESS CONTROL SYSTEM
  </div>

  <!-- ACCESS KEY LOGIN -->

  <section id="accessSection">

    <h2>🔑 Access Key</h2>

    <label for="accessKey">ENTER YOUR ACCESS KEY</label>

    <input
      id="accessKey"
      type="text"
      placeholder="Enter access key"
      autocomplete="off"
      spellcheck="false"
    >

    <button id="verifyButton">
      UNLOCK WEBSITE
    </button>

    <div id="accessStatus" class="status"
         aria-live="polite"></div>

    <div id="protectedContent" class="hidden">
      <h2>ACCESS GRANTED ✅</h2>
      <p>Welcome to NETHA CYBER HACKER!</p>
      <p>Your access key has been verified successfully.</p>
      <p id="welcomeMessage">
        You can now access the available website content.
      </p>
      <button id="lockButton" class="secondary">
        LOCK WEBSITE
      </button>
    </div>

  </section>

  <!-- ADMIN LOGIN -->

  <section class="panel">

    <h2>🔐 Admin Login</h2>

    <label for="adminPassword">ADMIN PASSWORD</label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button id="adminLogin">
      ADMIN LOGIN
    </button>

    <div id="adminStatus" class="status"
         aria-live="polite"></div>

    <!-- ADMIN PANEL -->

    <div id="adminTools" class="hidden">

      <div class="panel">

        <h2>⚙️ Admin Dashboard</h2>

        <label for="keyLabel">KEY LABEL (OPTIONAL)</label>

        <input
          id="keyLabel"
          type="text"
          maxlength="60"
          placeholder="e.g. Friend 1"
        >

        <button id="createKey">
          GENERATE 30-DAY KEY
        </button>

        <div id="newKey" class="keybox hidden"></div>

        <button id="refreshKeys" class="secondary">
          REFRESH KEY LIST
        </button>

        <div id="keyList"></div>

        <button id="adminLogout" class="secondary">
          ADMIN LOGOUT
        </button>

      </div>
    </div>

  </section>

  <footer>
    NETHA CYBER HACKER · ACCESS CONTROL DEMO
  </footer>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

async function api(path, data = {}) {
  const response = await fetch(path, {
    method: "POST",
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Invalid server response.");
  }

  if (!response.ok || result.ok === false) {
    throw new Error(
      result.error || "Request failed. Please try again."
    );
  }

  return result;
}

function showStatus(id, message, success = false) {
  const element = $(id);
  element.textContent = message;
  element.style.color = success ? "#00ff88" : "#ff8585";
}

function setBusy(button, busy, text) {
  button.disabled = busy;

  if (busy) {
    button.dataset.originalText = button.textContent;
    button.textContent = text || "PLEASE WAIT...";
  } else {
    button.textContent =
      button.dataset.originalText || button.textContent;
  }
}

/* ACCESS KEY VERIFICATION */

$("verifyButton").addEventListener("click", async () => {
  const key = $("accessKey").value.trim();

  if (!key) {
    showStatus("accessStatus", "Please enter your access key.");
    return;
  }

  const button = $("verifyButton");
  setBusy(button, true, "VERIFYING...");

  try {
    const result = await api("/api/verify", { key });

    $("protectedContent").classList.remove("hidden");

    showStatus(
      "accessStatus",
      result.message || "ACCESS GRANTED",
      true
    );

  } catch (error) {
    $("protectedContent").classList.add("hidden");

    showStatus(
      "accessStatus",
      error.message || "Invalid access key."
    );
  } finally {
    setBusy(button, false);
  }
});

$("accessKey").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    $("verifyButton").click();
  }
});

$("lockButton").addEventListener("click", () => {
  $("protectedContent").classList.add("hidden");
  $("accessKey").value = "";
  showStatus("accessStatus", "Website locked.");
});

/* ADMIN LOGIN */

$("adminLogin").addEventListener("click", async () => {
  const password = $("adminPassword").value;

  if (!password) {
    showStatus("adminStatus", "Enter the admin password.");
    return;
  }

  const button = $("adminLogin");
  setBusy(button, true, "LOGGING IN...");

  try {
    await api("/api/admin/login", { password });

    $("adminPassword").value = "";
    $("adminTools").classList.remove("hidden");

    showStatus("adminStatus", "Admin login successful.", true);

    await loadKeys();

  } catch (error) {
    showStatus(
      "adminStatus",
      error.message || "Admin login failed."
    );
  } finally {
    setBusy(button, false);
  }
});

$("adminPassword").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    $("adminLogin").click();
  }
});

/* GENERATE ACCESS KEY */

$("createKey").addEventListener("click", async () => {
  const label = $("keyLabel").value.trim();
  const button = $("createKey");

  setBusy(button, true, "GENERATING...");

  try {
    const result = await api("/api/admin/create", { label });

    $("newKey").classList.remove("hidden");
    $("newKey").textContent =
      "NEW ACCESS KEY: " + result.key +
      "\n\nSave this key now and share it only with its intended user.";

    $("keyLabel").value = "";

    await loadKeys();

  } catch (error) {
    showStatus("adminStatus", error.message);
  } finally {
    setBusy(button, false);
  }
});

/* LOAD ACCESS KEY LIST */

async function loadKeys() {
  const list = $("keyList");
  list.textContent = "Loading keys...";

  try {
    const result = await api("/api/admin/list");

    list.replaceChildren();

    const keys = Array.isArray(result.keys) ? result.keys : [];

    if (keys.length === 0) {
      list.textContent = "No access keys found.";
      return;
    }

    keys.forEach(key => {
      const item = document.createElement("div");
      item.className = "item";

      const title = document.createElement("strong");
      title.textContent = key.label || "Access Key";

      const details = document.createElement("p");
      const expiry = key.expires_at ?? key.expiresAt;
      const disabled = Number(key.disabled) === 1 ||
                       key.disabled === true;

      let expiryText = "Unknown";

      if (expiry !== undefined && expiry !== null) {
        const date = new Date(
          Number(expiry) < 100000000000
            ? Number(expiry) * 1000
            : Number(expiry)
        );

        if (!Number.isNaN(date.getTime())) {
          expiryText = date.toLocaleString();
        }
      }

      details.textContent =
        "ID: " + key.id +
        " | Expires: " + expiryText +
        " | Status: " + (disabled ? "Disabled" : "Active");

      item.append(title, details);

      if (!disabled) {
        const disableButton = document.createElement("button");
        disableButton.textContent = "DISABLE KEY";
        disableButton.addEventListener("click", async () => {
          disableButton.disabled = true;

          try {
            await api("/api/admin/disable", {
              id: key.id
            });

            await loadKeys();

          } catch (error) {
            showStatus("adminStatus", error.message);
            disableButton.disabled = false;
          }
        });

        item.appendChild(disableButton);
      }

      list.appendChild(item);
    });

  } catch (error) {
    list.textContent = "Could not load keys: " + error.message;
  }
}

$("refreshKeys").addEventListener("click", loadKeys);

/* ADMIN LOGOUT */

$("adminLogout").addEventListener("click", async () => {
  try {
    await api("/api/admin/logout");

    $("adminTools").classList.add("hidden");
    $("newKey").classList.add("hidden");
    $("keyList").replaceChildren();

    showStatus("adminStatus", "Logged out successfully.", true);

  } catch (error) {
    showStatus("adminStatus", error.message);
  }
});
</script>

</body>
  </html>
